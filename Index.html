<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>

<body>
    <div class="container flex bg-black">
        <div class="left">
            <div class="home bg-grey rounded m-1 p-1">
                <div class="logo"><img class="invert" src="Assets/Images/logo.svg" alt="logo"></div>
                <ul>
                    <li><img class="invert" src="Assets/Images/home.svg" alt="home">Home</li>
                    <li><img class="invert" src="Assets/Images/search.svg" alt="search">Search</li>
                </ul>
            </div>
            <div class="library bg-grey rounded m-1 p-1">
                <div class="heading">
                    <img class="invert" src="Assets/Images/playlist.svg" alt="">
                    <h2>Your library</h2>
                </div>

                <div class="footer">
                    <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/jp/privacy/"><span></span>PrivacyCenter</a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>PrivacyPolicy</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>AboutUs</span></a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility"><span></span>Accessibility</a></div>
                </div>
            </div>


        </div>
        <div class="right bg-grey rounded">
            <div class="header">
                <div class="nav">
                    <img class="invert" src="Assets/Images/left arrow.svg" alt="">
                    <img class="invert" src="Assets/Images/right arrow.svg" alt="">
                </div>
                <div class="button">
                    <button class="signupbtn">Sign up</button>
                    <button class="loginbtn">Login</button>
                </div>
            </div>

            <div class="spotify-playlists">
                <h1>Spotify playlist</h1>
                <div class="card-container">
                    <div class="card">
                        <div class="play"><img src="Assets/Images/play-button-arrowhead.svg" alt=""></div>
                        <img src="Assets/Images/Jailer.jpg" alt="">
                        <h3>Happy hits!</h3>
                        <p>Hits to boost your mood and fill you with happiness</p>
                    </div>

                    <div class="card">
                        <div class="play"><img src="Assets/Images/play-button-arrowhead.svg" alt=""></div>
                        <img src="Assets/Images/Jailer.jpg" alt="">
                        <h3>Happy hits!</h3>
                        <p>Hits to boost your mood and fill you with happiness</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
